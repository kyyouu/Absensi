<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login — Absensi KKN</title>
  <meta name="description" content="Halaman login administrator aplikasi absensi KKN." />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>

  <div class="login-page">

    <div class="login-card">
      <!-- Header -->
      <div class="login-header">
        <div class="login-logo">
          <img src="assets/images/logo.png" alt="Logo KKN" />
        </div>
        <h1 class="login-title">Admin Login</h1>
        <p class="login-subtitle">Masuk ke Panel Admin Absensi KKN</p>
      </div>

      <!-- Error Message -->
      <div class="login-error" id="loginError">
        <i class="fas fa-exclamation-circle"></i>
        <span>Username atau password salah.</span>
      </div>

      <!-- Login Form -->
      <form id="loginForm" novalidate>

        <!-- Username -->
        <div class="form-group">
          <label class="form-label" for="username">Username</label>
          <div class="input-wrap">
            <i class="fas fa-user input-icon"></i>
            <input
              type="text"
              id="username"
              class="input-field"
              placeholder="Masukkan username"
              autocomplete="username"
              required
            />
          </div>
        </div>

        <!-- Password -->
        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div class="input-wrap">
            <i class="fas fa-lock input-icon"></i>
            <input
              type="password"
              id="password"
              class="input-field"
              placeholder="Masukkan password"
              autocomplete="current-password"
              required
              style="padding-right: 44px;"
            />
            <button type="button" class="input-toggle" id="passwordToggle">
              <i class="fas fa-eye"></i>
            </button>
          </div>
        </div>

        <!-- Submit -->
        <button type="submit" class="btn-login" id="loginBtn">
          <i class="fas fa-sign-in-alt"></i> Masuk
        </button>

      </form>

      <!-- Back to absensi -->
      <div class="login-footer-link">
        <a href="index.html"><i class="fas fa-arrow-left"></i> Kembali ke Halaman Absensi</a>
      </div>
    </div>

  </div>

  <!-- Scripts -->
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>

</body>
</html>
